name: ci

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: pre-commit/action@v3.0.1

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - run: dotnet restore --locked-mode --configfile nuget.config
      - run: dotnet format --no-restore --severity info --verify-no-changes

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - run: dotnet restore --locked-mode --configfile nuget.config
      - run: dotnet build --no-restore -p:TreatWarningsAsErrors=true
      - name: Architecture Tests
        run: dotnet test --no-build --project tests/Architecture.Tests
      - name: Unit Tests
        run: |
          dotnet test --no-build --project tests/Domain.UnitTests
          dotnet test --no-build --project tests/Application.UnitTests
          dotnet test --no-build --project tests/Infrastructure.UnitTests
          dotnet test --no-build --project tests/Infrastructure.Shared.Api.UnitTests
      - name: Db Tests
        run: dotnet test --no-build --project tests/Infrastructure.DbTests
      - name: Integration Tests
        run: dotnet test --no-build --project tests/Foosball.Api.IntegrationTests
