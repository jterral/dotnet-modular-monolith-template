name: ci

on:
  workflow_dispatch:
  pull_request:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: pre-commit/action@v3.0.1

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - run: dotnet format style --severity info --verify-no-changes
      - run: dotnet format analyzers --severity info --verify-no-changes

  build-and-test:
    runs-on: ubuntu-latest
    needs:
      - pre-commit
      - format
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - run: dotnet restore --configfile nuget.config
      - run: dotnet build --no-restore -p:TreatWarningsAsErrors=true
      - run: dotnet test --no-restore --ignore-exit-code 8 --filter "FullyQualifiedName~Architecture.Tests"
      - run: dotnet test --no-restore --ignore-exit-code 8 --filter "FullyQualifiedName~UnitTests"
      - run: dotnet test --no-restore --ignore-exit-code 8 --filter "FullyQualifiedName~DbTests"
