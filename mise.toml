[env]
PROJECT_NAME = "dotnet-modular-monolith-template"

[tools]
uv = "0.12"
"pipx:pre-commit" = "4.6"
dotnet = "10.0.401"
"dotnet:dotnet-ef" = "10.0.12"

[tasks."dotnet:build"]
description = "Build the solution"
run = "dotnet build"

[tasks."dotnet:clean"]
description = "Clean build outputs"
run = "dotnet clean"

[tasks."dotnet:test"]
description = "Run all tests"
run = "dotnet test"

[tasks."dotnet:format"]
description = "Verify formatting without changing files"
run = "dotnet format --verify-no-changes"

[tasks."db:postgres"]
description = "Start a throwaway local PostgreSQL container"
run = """
docker run -it --rm \
  --name {{env.PROJECT_NAME}}-postgres \
  -e POSTGRES_PASSWORD=postgres \
  -p 5432:5432 \
  postgres:18.6
"""
