[env]
PROJECT_NAME = "dotnet-modular-monolith-template"

[tools]
uv = "0.12"
"pipx:pre-commit" = "4.6"
dotnet = "10.0.401"
"dotnet:dotnet-ef" = "10.0.12"

[task_config]
includes = [
  "git::ssh://git@github.com/jterral/my-mise-tasks.git//tasks/precommit",
]

[tasks."dotnet:build"]
description = "Build the solution"
run = "dotnet build"

[tasks."dotnet:clean"]
description = "Clean build outputs"
run = "dotnet clean"

[tasks."dotnet:ci:tests"]
description = "Run all tests as part of the CI pipeline"
run = [
  "dotnet test --no-build --project tests/Architecture.Tests",
  "dotnet test --no-build --project tests/Domain.UnitTests",
  "dotnet test --no-build --project tests/Application.UnitTests",
  "dotnet test --no-build --project tests/Infrastructure.UnitTests",
  "dotnet test --no-build --project tests/Infrastructure.Shared.Api.UnitTests",
  "dotnet test --no-build --project tests/Infrastructure.DbTests",
  "dotnet test --no-build --project tests/Foosball.Api.IntegrationTests",
]

[tasks."dotnet:ci:format"]
description = "Verify formatting without changing files"
run = [
  "dotnet restore --locked-mode --configfile nuget.config",
  "dotnet format --severity info --verify-no-changes",
]

[tasks."dotnet:foosball:db-init"]
description = "Initialize the foosball database"
run = """
dotnet-ef migrations add InitialCreate \
    --project ./src/Infrastructure/Infrastructure.csproj \
    --startup-project ./src/Hosts/Foosball.Migrator/Foosball.Migrator.csproj \
    --output-dir ./Foosball/Persistence/Migrations
"""
