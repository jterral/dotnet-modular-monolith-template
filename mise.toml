[env]
PROJECT_NAME = "dotnet-modular-monolith-template"

[tools]
uv = "0.12"
"pipx:pre-commit" = "4.6"
dotnet = "10.0.401"
"dotnet:dotnet-ef" = "10.0.12"

[tasks."dotnet:build"]
description = "Build the solution"
run = "dotnet build"

[tasks."dotnet:clean"]
description = "Clean build outputs"
run = "dotnet clean"

[tasks."dotnet:ci:test"]
description = "Run all tests as part of the CI pipeline"
run = """
dotnet test --no-restore --ignore-exit-code 8 --filter "FullyQualifiedName~Architecture.Tests"
dotnet test --no-restore --ignore-exit-code 8 --filter "FullyQualifiedName~UnitTests"
dotnet test --no-restore --ignore-exit-code 8 --filter "FullyQualifiedName~DbTests"
"""

[tasks."dotnet:ci:format"]
description = "Verify formatting without changing files"
run = """
dotnet format style --severity info --verify-no-changes
dotnet format analyzers --severity info --verify-no-changes
"""
